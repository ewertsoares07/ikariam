# Netlify: Base directory = Ikariam. Publica esta pasta como está, sem build.
[build]
  publish = "."

# O service worker e o manifest precisam sempre da versão mais nova
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # O login do Google abre uma janela: este cabeçalho deixa ela falar com o app
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
